<title>受験の日程表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 志望校ごとの横長スケジュール表(左に校名、日付は横スクロール) + 日程順リスト + ボトムシートの編集フォーム */
:root{
  --bg:#f5f1f7; --surface:#ffffff; --surface2:#efe9f2; --fg:#241b2b; --muted:#6d6277; --line:#e1d8e7;
  --accent:#7d4a8a; --on-accent:#ffffff; --danger:#c8323f; --sat:#3f6fa8; --sun:#c8323f; --warn-bg:#fff3d6; --warn-fg:#6b4a00;
  --font-d:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --font-b:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --lab:112px; --col:96px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131b; --surface:#221d27; --surface2:#2c2632; --fg:#f1ebf5; --muted:#a498ae; --line:#38303f;
  --accent:#c28bd0; --on-accent:#1d1222; --danger:#ff7b86; --sat:#7fb0e6; --sun:#ff8a93; --warn-bg:#3b3015; --warn-fg:#f2d48a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17131b; --surface:#221d27; --surface2:#2c2632; --fg:#f1ebf5; --muted:#a498ae; --line:#38303f;
  --accent:#c28bd0; --on-accent:#1d1222; --danger:#ff7b86; --sat:#7fb0e6; --sun:#ff8a93; --warn-bg:#3b3015; --warn-fg:#f2d48a; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

.top{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:900;font-size:19px;letter-spacing:.02em;margin-right:auto}
.brand svg{width:26px;height:26px;flex:none}
.btn{border:0;border-radius:999px;padding:8px 16px;background:var(--surface2);font-weight:700;min-height:38px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.bar{display:flex;align-items:center;gap:10px;padding:0 14px 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 4px;min-height:34px}

.banner{margin:0 14px 10px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);display:flex;gap:10px;align-items:flex-start;font-size:13px}
.banner span{flex:1;min-width:0}
.banner button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0 2px;flex:none}

.board{flex:1;min-height:0;overflow:auto;background:var(--surface);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.inner{width:max-content;min-width:100%}
.grid{display:grid;grid-template-columns:var(--lab) repeat(var(--n),var(--col));position:relative}
.head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:6;background:var(--surface);border-right:1px solid var(--line)}
.dh{padding:6px 0;text-align:center;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.25}
.dh b{font-family:var(--font-d);font-size:15px;display:block}
.dh span{font-size:11px;color:var(--muted)}
.dh.sat span,.dh.sat b{color:var(--sat)} .dh.sun span,.dh.sun b{color:var(--sun)}
.dh.today{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.dh.today b{color:var(--accent)}
.school{border-bottom:1px solid var(--line);padding-block:7px;row-gap:6px;
  background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--col) - 1px),var(--line) calc(var(--col) - 1px) var(--col));
  background-size:calc(100% - var(--lab)) 100%;background-position:var(--lab) 0;background-repeat:no-repeat}
.todaycol{grid-row:1/-1;background:color-mix(in srgb,var(--accent) 9%,transparent);pointer-events:none;margin-block:-7px}
.name{grid-column:1;position:sticky;left:0;z-index:3;border:0;text-align:left;background:var(--c);color:var(--on);
  padding:9px 10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:flex-start;margin-block:-7px;border-radius:0}
.name .n{font-family:var(--font-d);font-weight:900;font-size:14px;line-height:1.3;word-break:break-all}
.name .sub{font-size:11.5px;font-weight:500;line-height:1.3;word-break:break-all;opacity:.95}
.name .ex{font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;background:color-mix(in srgb,var(--on) 22%,transparent)}
.name .no{font-size:11px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.chip{border:0;text-align:left;border-radius:9px;padding:5px 10px;min-height:32px;display:flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--c) 30%,var(--surface));color:var(--fg);white-space:nowrap;overflow:hidden;font-size:12.5px;margin-inline:2px}
.chip.est{outline:1.5px dashed color-mix(in srgb,var(--c) 85%,var(--fg));outline-offset:-2px}
.chip b{font-weight:700}
.tag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;background:color-mix(in srgb,var(--c) 70%,#000);color:#fff;flex:none}
.tag.est{background:var(--warn-bg);color:var(--warn-fg);outline:1px solid color-mix(in srgb,var(--warn-fg) 40%,transparent)}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty p{max-width:30ch;margin:0}
.note{font-size:12px;color:var(--muted);padding:14px}

.agenda{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding:6px 14px 24px}
.day{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.day.past{opacity:.5}
.dd{font-family:var(--font-d);font-weight:900;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.dd small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
.items{display:grid;gap:8px;min-width:0}
.it{border:0;text-align:left;background:var(--surface);border-radius:10px;padding:8px 10px;display:grid;gap:2px;border-left:6px solid var(--c);min-width:0}
.it .l1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.it .sc{font-weight:700}
.it .sub{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.cd{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;gap:8px}
.sheet-top h2{margin:0;font-family:var(--font-d);font-size:17px;font-weight:900}
.sheet-top .btn:first-child{justify-self:start}.sheet-top .btn:last-child{justify-self:end}
.sheet-body{flex:1;overflow:auto;padding:4px 14px 20px;display:grid;gap:16px;align-content:start}
.card{background:var(--surface);border-radius:20px;padding:4px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row>label,.row>.lab{font-weight:500;white-space:nowrap}
.req{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--accent) 25%,var(--surface));color:var(--accent);border-radius:6px;padding:1px 7px;margin-left:8px}
.val{display:flex;align-items:center;gap:6px;min-width:0;flex:1;justify-content:flex-end}
.val input,.val select{border:0;background:transparent;text-align:right;min-width:0;width:100%;max-width:210px;color:var(--accent);font-variant-numeric:tabular-nums;padding:6px 0;-webkit-appearance:none;appearance:none}
.val input::placeholder{color:var(--muted);opacity:.8}
.val input[type="date"],.val input[type="time"]{max-width:150px}
.clr{flex:none;width:28px;height:28px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);display:grid;place-items:center;font-size:15px;line-height:1}
.checks{display:flex;gap:14px}
.chk{display:flex;align-items:center;gap:6px;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sw{width:30px;height:30px;border-radius:50%;border:0;background:var(--sw);display:grid;place-items:center;padding:0}
.sw[aria-pressed="true"]::after{content:"";width:12px;height:7px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ih{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 2px;font-weight:700;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.ih>span:last-child{display:flex;gap:12px}
.num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--fg);color:var(--bg);font-size:12px;margin-right:6px}
.est{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:8px;background:var(--warn-bg);color:var(--warn-fg)}
.ih button{border:0;background:none;color:var(--danger);font-weight:700}
.ih button[data-ok]{color:var(--accent)}
.add{width:100%;border:0;background:none;color:var(--accent);font-weight:700;padding:14px 0;font-size:15px}
.hint{font-size:12px;color:var(--muted);padding:0 6px;margin:0}
.hint.warn{background:var(--warn-bg);color:var(--warn-fg);padding:8px 10px;border-radius:10px}
.sheet-foot{display:flex;justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.pcs{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px}
.pc{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;color:var(--muted);min-height:36px}
.pc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wlab{font-weight:700;font-size:12.5px;color:var(--muted);padding-top:12px}
.rm{border:0;background:none;color:var(--danger);font-weight:700;padding:10px 0 12px}
.inline{display:flex;gap:8px;align-items:center;padding:8px 0}
.qrow{display:grid;gap:6px;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.qrow label{font-size:12px;font-weight:700;color:var(--accent)}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap;padding:6px 12px}
.cal{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--surface);padding-bottom:24px}
.calhead{display:flex;align-items:center;gap:8px;padding:10px 14px}
.calhead b{font-family:var(--font-d);font-size:17px;margin-right:auto;font-variant-numeric:tabular-nums}
.calhead .nav{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface2);font-size:20px;line-height:1;padding:0}
.wk,.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.wk span:first-child{color:var(--sun)}.wk span:last-child{color:var(--sat)}
.dc{border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:transparent;min-height:84px;padding:3px 2px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-width:0;border-radius:0}
.dc:nth-child(7n+1){border-left:0}
.dc .dn{font-size:11px;font-weight:700;padding:0 3px;font-variant-numeric:tabular-nums}
.dc.out{opacity:.4}
.dc.sat .dn{color:var(--sat)}.dc.sun .dn{color:var(--sun)}
.dc.today .dn{background:var(--accent);color:var(--on-accent);border-radius:999px;align-self:flex-start;padding:0 6px}
.dc.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.cc{font-size:10px;line-height:1.35;border-radius:4px;padding:0 3px;background:color-mix(in srgb,var(--c) 32%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;display:block}
.cb{height:5px;border-radius:3px;background:var(--c);opacity:.7;margin:1px 0;display:block}
.cm{font-size:10px;color:var(--muted);padding:0 3px}
.daypanel{padding:14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.daypanel h3{margin:0;font-family:var(--font-d);font-size:15px}
.cards{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding:12px 14px 24px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-content:start}
.cardx{border:0;padding:0;text-align:left;background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cardx .ch{background:var(--c);color:var(--on);padding:10px 12px;display:grid;gap:2px}
.cardx .ch .n{font-family:var(--font-d);font-weight:900;font-size:15px}
.cardx .ch .sub{font-size:12px}
.cardx .nx{font-size:12px;font-weight:700;margin-top:4px}
.cardx ul{list-style:none;margin:0;padding:8px 12px 12px;display:grid;gap:5px}
.cardx li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.cardx li.past{opacity:.5}
.cardx li b{min-width:4.5em}
.filebtn{position:relative;overflow:hidden;color:var(--accent);display:inline-flex;align-items:center;flex:none}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.imgcard{padding-bottom:10px}
.ta{width:100%;min-height:130px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px;font-size:12px;line-height:1.45;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;display:block;margin:8px 0}
.card .inline{flex-wrap:wrap}
.qin{display:flex;gap:8px;align-items:center}
.qrow .qin input.q{width:auto;flex:1 1 0;min-width:0}
.qin .btn{flex:none;padding:8px 12px;min-height:42px;color:var(--accent)}
.pick{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.pick[hidden]{display:none}
.pick-p{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-height:94%;overflow:auto}
.pick-t{font-family:var(--font-d);font-weight:900;font-size:16px}
.pick-h{display:flex;align-items:center;gap:8px}
.pick-h b{margin-right:auto;font-family:var(--font-d);font-size:17px;font-variant-numeric:tabular-nums}
.pick-h .nav{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface2);font-size:20px;line-height:1;padding:0}
.pk{border:0;background:transparent;min-height:44px;font-weight:500;font-variant-numeric:tabular-nums;border-radius:0;padding:0}
.pk span{display:grid;place-items:center;width:38px;height:38px;margin:auto;border-radius:50%}
.pk.out{opacity:.45}
.pk.sat{color:var(--sat)}.pk.sun{color:var(--sun)}
.pk.today span{box-shadow:inset 0 0 0 1.5px var(--accent)}
.pk.r{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.pk.s.hasend{background:linear-gradient(to right,transparent 50%,color-mix(in srgb,var(--accent) 18%,transparent) 50%)}
.pk.e.hasend{background:linear-gradient(to left,transparent 50%,color-mix(in srgb,var(--accent) 18%,transparent) 50%)}

<script>
(function(){
var KEY='juken-nittei-v1', DAY=86400000, COL=96;
var COLORS=['#8c5a96','#54739a','#3fa78a','#86b85f','#e58f20','#e04a56'];
var LABELS=['試験','集合','面接','見学','その他'];
var PRESETS=['A日程','B日程','共通テスト利用','総合型選抜','学校推薦型','前期','後期'];
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

/* ---- date helpers ---- */
var pd=function(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/DAY};
var fd=function(n){return new Date(n*DAY)};
var fmt=function(n){var d=fd(n);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()};
var wd=function(n){return '日月火水木金土'[fd(n).getUTCDay()]};
var tm=function(t){return t?t.replace(/^0/,''):''};
var now=new Date(), today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/DAY;
var onColor=function(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>165?'#1d1722':'#ffffff'};
var yen=function(v){return v?'¥'+Number(v).toLocaleString('ja-JP'):''};
var label=function(s){return [s.univ,s.faculty,s.dept,s.exam].filter(Boolean).join(' ')};

/* ---- storage ---- */
function seed(){return [{id:uid(),univ:'千葉工業大学',faculty:'',dept:'',exam:'A日程',examNo:'',color:'#e04a56',order:'',
  apps:[{start:'2026-12-22',end:'2027-01-31',web:true,mail:true}],
  exams:[{date:'2027-02-01',label:'試験'},{date:'2027-02-02',label:'試験'},{date:'2027-02-03',label:'試験'},{date:'2027-02-04',label:'試験'}],
  results:[{date:'2027-02-09',web:true,board:true}],enrolls:[]}]}
function load(){var v=null;try{var r=localStorage.getItem(KEY);if(r){v=JSON.parse(r)}}catch(e){}
  if(!Array.isArray(v))v=seed();
  v.forEach(function(s){if(s.univ==null){s.univ=s.name||'';s.faculty=s.faculty||'';s.dept=s.dept||'';s.exam=s.exam||''}
    ['apps','exams','results','enrolls'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]})});
  return v}
var schools=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(schools))}catch(e){}}

/* ---- events ---- */
function rng(s,e,st,et){return fmt(s)+(st?' '+tm(st):'')+(e!==s||et?'〜':'')+(e!==s?fmt(e):'')+(et?' '+tm(et):'')}
function eventsOf(s){
  var ev=[];
  var T=function(list,est){return list.filter(Boolean).concat(est?['目安']:[])};
  (s.apps||[]).forEach(function(a){if(!(a.start||a.end))return;var S=pd(a.start||a.end),E=pd(a.end||a.start);
    ev.push({k:'app',label:'出願期間',s:S,e:E,text:rng(S,E,a.startTime,a.endTime),tags:T([a.web&&'WEB',a.mail&&'郵送'],a.est),est:a.est,fee:a.fee})});
  (s.exams||[]).forEach(function(a){if(!a.date)return;var S=pd(a.date);
    ev.push({k:'exam',label:a.label||'試験',s:S,e:S,text:fmt(S)+(a.start?' '+tm(a.start):'')+(a.end?'〜'+tm(a.end):''),tags:T([],a.est),est:a.est})});
  (s.results||[]).forEach(function(a){if(!a.date)return;var S=pd(a.date);
    ev.push({k:'res',label:'合格発表',s:S,e:S,text:fmt(S)+(a.time?' '+tm(a.time):''),tags:T([a.web&&'WEB',a.board&&'掲示'],a.est),est:a.est})});
  (s.enrolls||[]).forEach(function(a){if(!(a.start||a.end))return;var S=pd(a.start||a.end),E=pd(a.end||a.start);
    ev.push({k:'enr',label:'入学手続',s:S,e:E,text:rng(S,E,a.startTime,a.endTime),tags:T([],a.est),est:a.est,fee:a.fee})});
  return ev.sort(function(a,b){return a.s-b.s||a.e-b.e});
}
function firstDay(s){var e=eventsOf(s);return e.length?e[0].s:1e9}
function sorted(){
  var gf={};schools.forEach(function(s){var f=firstDay(s);gf[s.univ]=Math.min(gf[s.univ]==null?1e9:gf[s.univ],f)});
  return schools.slice().sort(function(a,b){
    var ao=a.order===''||a.order==null?null:Number(a.order),bo=b.order===''||b.order==null?null:Number(b.order);
    if(ao!=null&&bo!=null&&ao!==bo)return ao-bo; if(ao!=null&&bo==null)return -1; if(ao==null&&bo!=null)return 1;
    if(gf[a.univ]!==gf[b.univ])return gf[a.univ]-gf[b.univ];
    if(a.univ!==b.univ)return a.univ<b.univ?-1:1;
    return firstDay(a)-firstDay(b)||(label(a)<label(b)?-1:1)})}

/* ---- views ---- */
var VIEWS=['board','cal','agenda','cards'], boardMin=0, calY=null, calM=0, selDay=null;
var view='board';try{var vv=localStorage.getItem('juken-view');if(VIEWS.indexOf(vv)>=0)view=vv}catch(e){}
function render(){
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===view)});
  $('#jump').hidden=view!=='board';
  $('#main').innerHTML=view==='board'?boardHtml():view==='cal'?calHtml():view==='cards'?cardsHtml():agendaHtml();
}
function setView(v){view=v;try{localStorage.setItem('juken-view',v)}catch(e){}render()}
function emptyHtml(){return '<div class="empty"><p>学校と学部・学科、受ける試験を追加すると、日程がここに並びます。</p><button class="btn primary" data-new="1">最初の学校を追加</button></div>'}
function noteHtml(){return '<div class="note">入力したデータは、このブラウザに保存されます。「目安」の付いた日程は未確認です。募集要項で確認してください。</div>'}

function boardHtml(){
  var list=sorted(); if(!list.length)return emptyHtml();
  var all=[];list.forEach(function(s){eventsOf(s).forEach(function(e){all.push(e)})});
  var min=all.length?Math.min.apply(null,all.map(function(e){return e.s}))-1:today-1;
  var max=all.length?Math.max.apply(null,all.map(function(e){return e.e}))+3:today+30;
  boardMin=min; var N=max-min+1;
  var h='<div class="board" id="board"><div class="inner">';
  h+='<div class="grid head" style="--n:'+N+'"><div class="corner"></div>';
  for(var d=min;d<=max;d++){var w=fd(d).getUTCDay();
    h+='<div class="dh'+(w===6?' sat':w===0?' sun':'')+(d===today?' today':'')+'"><b>'+fmt(d)+'</b><span>'+wd(d)+'</span></div>'}
  h+='</div>';
  list.forEach(function(s){
    var evs=eventsOf(s), rows=Math.max(evs.length,1), sub=[s.faculty,s.dept].filter(Boolean).join(' ');
    h+='<section class="grid school" style="--n:'+N+';--c:'+s.color+';--on:'+onColor(s.color)+';grid-template-rows:repeat('+rows+',auto)">';
    if(today>=min&&today<=max)h+='<div class="todaycol" style="grid-column:'+(today-min+2)+'"></div>';
    h+='<button class="name" data-edit="'+s.id+'" style="grid-row:1 / span '+rows+'" aria-label="'+esc(label(s))+'を編集"><span class="n">'+esc(s.univ)+'</span>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+(s.exam?'<span class="ex">'+esc(s.exam)+'</span>':'')+(s.examNo?'<span class="no">No.'+esc(s.examNo)+'</span>':'')+'</button>';
    evs.forEach(function(e,i){
      var c=e.s-min+2, span=Math.max(e.e-e.s+1,e.text.length+e.label.length+e.tags.length*3>20?3:2);
      if(c+span>N+2)span=N+2-c; if(span<1)span=1;
      h+='<button class="chip'+(e.est?' est':'')+'" data-edit="'+s.id+'" style="grid-row:'+(i+1)+';grid-column:'+c+' / span '+span+'"><b>'+esc(e.label)+'</b> '+esc(e.text)+e.tags.map(function(t){return '<span class="tag'+(t==='目安'?' est':'')+'">'+t+'</span>'}).join('')+'</button>';
    });
    if(!evs.length)h+='<div style="grid-row:1;grid-column:2 / -1;color:var(--muted);padding:6px 10px">日程が未入力です。左の校名をタップして追加できます。</div>';
    h+='</section>';
  });
  return h+'</div>'+noteHtml()+'</div>';
}
function rel(e){
  if(today<e.s){var n=e.s-today;return n===1?'明日':'あと'+n+'日'}
  if(today<=e.e){if(e.s===e.e)return '今日';var r=e.e-today;return r===0?'今日まで':'〆あと'+r+'日'}
  return '終了';
}
function agendaHtml(){
  var list=sorted(); if(!list.length)return emptyHtml();
  var items=[];list.forEach(function(s){eventsOf(s).forEach(function(e){e.sc=s;items.push(e)})});
  if(!items.length)return '<div class="empty"><p>まだ日程が入力されていません。</p></div>';
  items.sort(function(a,b){return a.s-b.s||a.e-b.e});
  var groups=[],cur=null;
  items.forEach(function(e){if(!cur||cur.d!==e.s){cur={d:e.s,list:[]};groups.push(cur)}cur.list.push(e)});
  var h='<div class="agenda">';
  groups.forEach(function(g){
    var past=g.list.every(function(e){return e.e<today});
    h+='<div class="day'+(past?' past':'')+'"><div class="dd">'+fmt(g.d)+'<small>'+fd(g.d).getUTCFullYear()+' '+wd(g.d)+'</small></div><div class="items">';
    g.list.forEach(function(e){var s=e.sc;
      h+='<button class="it" data-edit="'+s.id+'" style="--c:'+s.color+'"><span class="l1"><span class="sc">'+esc(label(s))+'</span>'+e.tags.map(function(t){return '<span class="tag'+(t==='目安'?' est':'')+'" style="--c:'+s.color+'">'+t+'</span>'}).join('')+'<span class="cd">'+rel(e)+'</span></span>'+
        '<span class="sub">'+esc(e.label)+'　'+esc(e.text)+(e.fee?'　'+yen(e.fee):'')+'</span></button>';
    });
    h+='</div></div>';
  });
  return h+noteHtml()+'</div>';
}
/* ---- カレンダー ---- */
var SHORT={'出願期間':'出願','合格発表':'発表','入学手続':'手続'};
function allEvents(){var out=[];sorted().forEach(function(s){eventsOf(s).forEach(function(e){e.sc=s;out.push(e)})});return out}
function initCal(){
  var evs=allEvents(),best=null;
  evs.forEach(function(e){if(e.e>=today&&(best===null||e.s<best))best=e.s});
  var base=best!==null?best:today, d=fd(base);
  calY=d.getUTCFullYear();calM=d.getUTCMonth();selDay=base;
}
function dayItems(evs,n){
  var txt=[],bars=[];
  evs.forEach(function(e){if(n<e.s||n>e.e)return;var sh=SHORT[e.label]||e.label;
    if(e.s===e.e||n===e.s)txt.push({e:e,t:sh});else if(n===e.e)txt.push({e:e,t:'〆'+sh});else bars.push({e:e})});
  return txt.concat(bars);
}
function itemHtml(e){var s=e.sc;
  return '<button class="it" data-edit="'+s.id+'" style="--c:'+s.color+'"><span class="l1"><span class="sc">'+esc(label(s))+'</span>'+e.tags.map(function(t){return '<span class="tag'+(t==='目安'?' est':'')+'" style="--c:'+s.color+'">'+t+'</span>'}).join('')+'<span class="cd">'+rel(e)+'</span></span><span class="sub">'+esc(e.label)+'　'+esc(e.text)+(e.fee?'　'+yen(e.fee):'')+'</span></button>';
}
function calHtml(){
  if(!schools.length)return emptyHtml();
  if(calY===null)initCal();
  var evs=allEvents();
  var first=Date.UTC(calY,calM,1)/DAY, dow=fd(first).getUTCDay(), start=first-dow;
  var dim=new Date(Date.UTC(calY,calM+1,0)).getUTCDate(), weeks=Math.ceil((dow+dim)/7);
  var h='<div class="cal"><div class="calhead"><b>'+calY+'年'+(calM+1)+'月</b><button class="link" data-cal="today">今日</button><button class="nav" data-cal="-1" aria-label="前の月">‹</button><button class="nav" data-cal="1" aria-label="次の月">›</button></div>';
  h+='<div class="wk">'+'日月火水木金土'.split('').map(function(c){return '<span>'+c+'</span>'}).join('')+'</div><div class="cg">';
  for(var i=0;i<weeks*7;i++){
    var n=start+i, d=fd(n), w=d.getUTCDay(), inM=d.getUTCMonth()===calM;
    var items=dayItems(evs,n), shown=items.slice(0,3), more=items.length-shown.length;
    h+='<button class="dc'+(inM?'':' out')+(w===6?' sat':w===0?' sun':'')+(n===today?' today':'')+(n===selDay?' sel':'')+'" data-day="'+n+'" aria-label="'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日"><span class="dn">'+d.getUTCDate()+'</span>';
    shown.forEach(function(it){var c='--c:'+it.e.sc.color;
      h+=it.t?'<span class="cc" style="'+c+'">'+esc(it.t)+'</span>':'<span class="cb" style="'+c+'"></span>'});
    if(more>0)h+='<span class="cm">+'+more+'</span>';
    h+='</button>';
  }
  h+='</div>';
  if(selDay!=null){
    var list=evs.filter(function(e){return e.s<=selDay&&selDay<=e.e});
    h+='<div class="daypanel"><h3>'+fmt(selDay)+'('+wd(selDay)+')の予定</h3>'+(list.length?list.map(itemHtml).join(''):'<div class="note" style="padding:0">この日の予定はありません。</div>')+'</div>';
  }
  return h+noteHtml()+'</div>';
}

/* ---- カード ---- */
function cardsHtml(){
  var list=sorted();if(!list.length)return emptyHtml();
  var h='<div class="cards">';
  list.forEach(function(s){
    var evs=eventsOf(s),next=evs.filter(function(e){return e.e>=today})[0],sub=[s.faculty,s.dept].filter(Boolean).join(' ');
    h+='<button class="cardx" data-edit="'+s.id+'" style="--c:'+s.color+';--on:'+onColor(s.color)+'"><div class="ch"><span class="n">'+esc(s.univ)+'</span>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+(s.exam?'<span class="sub">'+esc(s.exam)+(s.examNo?'　No.'+esc(s.examNo):'')+'</span>':'')+
      (s.memo?'<span class="sub">メモ: '+esc(s.memo)+'</span>':'')+'<span class="nx">'+(next?'次: '+esc(next.label)+' '+esc(next.text)+'('+rel(next)+')':(evs.length?'すべて終了':'日程が未入力です'))+'</span></div>';
    if(evs.length){h+='<ul>';evs.forEach(function(e){h+='<li'+(e.e<today?' class="past"':'')+'><b>'+esc(e.label)+'</b><span>'+esc(e.text)+'</span>'+e.tags.map(function(t){return '<span class="tag'+(t==='目安'?' est':'')+'">'+t+'</span>'}).join('')+'</li>'});h+='</ul>'}
    h+='</button>';
  });
  return h+'</div>';
}

function jump(){
  var b=$('#board');if(!b)return;
  var best=null;sorted().forEach(function(s){eventsOf(s).forEach(function(e){if(e.e>=today&&(best===null||e.s<best))best=e.s})});
  if(best===null)best=boardMin+1;
  b.scrollTo({left:Math.max(0,(best-boardMin)*COL-12),behavior:'smooth'});
}

/* ---- shared form helpers ---- */
var idOf=function(pre,p){return pre+p.replace(/\./g,'-')};
function row(lab,path,type,ph,val,req,pre){pre=pre||'f-';
  var clr=(type==='date'||type==='time')?'<button type="button" class="clr" data-clear="'+path+'" aria-label="消去" '+(val?'':'hidden')+'>×</button>':'';
  return '<div class="row"><label for="'+idOf(pre,path)+'">'+lab+(req?'<span class="req">必須</span>':'')+'</label><div class="val"><input id="'+idOf(pre,path)+'" data-path="'+path+'" type="'+type+'" '+(type==='number'?'inputmode="numeric" min="0" ':'')+'value="'+esc(val)+'" placeholder="'+ph+'" '+(type==='text'?'autocomplete="off"':'')+'>'+clr+'</div></div>';
}
function checks(lab,items){return '<div class="row"><span class="lab">'+lab+'</span><div class="checks">'+items.map(function(i){return '<label class="chk"><input type="checkbox" data-path="'+i[0]+'" '+(i[2]?'checked':'')+'> '+i[1]+'</label>'}).join('')+'</div></div>'}
function sel(lab,path,val){return '<div class="row"><label for="'+idOf('f-',path)+'">'+lab+'</label><div class="val"><select id="'+idOf('f-',path)+'" data-path="'+path+'">'+LABELS.map(function(l){return '<option'+(l===val?' selected':'')+'>'+l+'</option>'}).join('')+'</select></div></div>'}
function setPath(o,path,v){var k=path.split('.');for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400)}

/* ---- editor ---- */
var draft=null, editingId=null, delArmed=false;
var DEF={apps:function(){return {web:true,mail:true}},exams:function(){return {label:'試験'}},results:function(){return {web:true,board:true}},enrolls:function(){return {}}};
function blank(){return {id:uid(),univ:'',faculty:'',dept:'',exam:'',examNo:'',color:COLORS[0],order:'',apps:[],exams:[],results:[],enrolls:[]}}
function pad(d){['apps','exams','results','enrolls'].forEach(function(k){if(!d[k]||!d[k].length)d[k]=[DEF[k]()]});return d}
function section(key,title,addLabel,fn){
  var arr=draft[key], h='<div class="card">';
  arr.forEach(function(it,i){
    var p=key+'.'+i+'.';

async function readAndApply(files){
  if(!sampleFn){setImgMsg('この画面では画像の読み取りを使えません。');return}
  var lim=null;try{lim=await sampleFn.limits()}catch(e){}
  if(!lim||!lim.images){setImgMsg('この画面では画像の読み取りを使えません。');return}
  var arr=files.slice(0,lim.images.maxCount);
  var y=now.getMonth()>=3?now.getFullYear()+1:now.getFullYear();
  var prompt='添付画像は、大学などの入試日程が書かれた画面(スクリーンショットや写真)です。画像に書かれている内容だけを読み取り、JSONのみで返してください。画像に無い項目は空にし、推測で日付を作らないでください。\n'+
   '年が書かれていればその年を使い、省略されていれば'+y+'年度入試として補ってください。\n'+
   'ルール:\n- 日付は YYYY-MM-DD、時刻は24時間の HH:MM、金額は円の整数。\n'+
   '- apps: 出願(願書受付)期間。複数あれば複数件。郵送(消印有効など)なら mail:true、ウェブ出願なら web:true。\n'+
   '- exams: 試験日。「17日・18日」のように複数日なら1日ごとに1件。label は 試験/集合/面接/見学/その他。時間が書かれていれば start/end。\n'+
   '- results: 合格発表日。\n'+
   '- enrolls: 入学手続・入学金納入・最終手続などの締切。項目ごとに1件。開始日が無ければ start は空にし、締切日を end に入れる。\n'+
   '- univ, faculty, dept, exam: 画像から分かれば入れる(例: 千葉工業大学 / A日程)。分からなければ空。\n'+
   '- memo: 日程の補足(消印有効、出納印有効、例外条件など)を短くまとめる。\n'+
   '形式: {"univ":"","faculty":"","dept":"","exam":"","apps":[{"start":"","end":"","startTime":"","endTime":"","web":false,"mail":false,"fee":0}],"exams":[{"date":"","start":"","end":"","label":"試験"}],"results":[{"date":"","time":"","web":false,"board":false}],"enrolls":[{"start":"","end":"","endTime":"","fee":0}],"memo":""}';
  imgCtl=new AbortController();
  setImgMsg('画像を読み取っています…(数十秒かかることがあります)');
  try{
    var data=await sampleFn.json(prompt,{images:arr,signal:imgCtl.signal,modelTier:'default',cache:false});
    if(!draft)return;
    var cl=cleanAll(data||{}),n=0;
    ['apps','exams','results','enrolls'].forEach(function(k){if(cl[k].length){cl[k].forEach(function(it){delete it.est});draft[k]=cl[k];n+=cl[k].length}});
    ['univ','faculty','dept','exam'].forEach(function(k){if(!draft[k]&&data&&typeof data[k]==='string')draft[k]=data[k].trim().slice(0,60)});
    if(data&&typeof data.memo==='string'&&data.memo.trim())draft.memo=data.memo.trim().slice(0,300);
    if(!n){setImgMsg('この画像から日程を読み取れませんでした。別の画像を試すか、手入力してください。');return}
    setImgMsg('読み取りました。日付を確認してから「保存」を押してください。');
    rerenderForm();toast(n+'件の日程を入力しました');
  }catch(e){
    var c=e&&e.code;
    if(c==='cancelled')setImgMsg('');
    else if(c==='image_rejected')setImgMsg('この画像は読み取れません。JPEG・PNG・WebP・GIFの画像を選んでください。');
    else if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled')setImgMsg('Claudeの利用が許可されていないため、読み取りは使えません。');
    else if(c==='rate_limited')setImgMsg('利用回数の上限に達しました。時間をおいてください。');
    else setImgMsg('読み取りに失敗しました。もう一度試すか、手入力してください。');
  }finally{imgCtl=null}
}

var pick=null;
function dayIso(n){var d=fd(n);return isoOf(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
function openPick(key,i){
  var it=draft[key][i],single=(key==='exams'||key==='results'),s=null,e=null;
  if(single){if(it.date)s=pd(it.date)}else{if(it.start)s=pd(it.start);if(it.end)e=pd(it.end)}
  var d=fd(s!=null?s:today);
  pick={key:key,i:i,single:single,s:s,e:e,y:d.getUTCFullYear(),m:d.getUTCMonth()};
  renderPick();$('#pick').hidden=false;
}
function closePick(){pick=null;var p=$('#pick');p.hidden=true;p.innerHTML=''}
function pickSummary(){
  var f=function(n){var d=fd(n);return d.getUTCFullYear()+'/'+(d.getUTCMonth()+1)+'/'+d.getUTCDate()};
  if(pick.s==null)return pick.single?'日付をタップしてください':'開始日をタップしてください';
  if(pick.single)return f(pick.s);
  if(pick.e==null)return f(pick.s)+' 〜 (終了日をタップ)';
  return pick.e===pick.s?f(pick.s)+'(1日のみ)':f(pick.s)+' 〜 '+f(pick.e);
}
function renderPick(){
  var T={apps:'出願期間',exams:'試験日',results:'合格発表日',enrolls:'入学手続'}[pick.key];
  var first=Date.UTC(pick.y,pick.m,1)/DAY,dow=fd(first).getUTCDay(),start=first-dow;
  var dim=new Date(Date.UTC(pick.y,pick.m+1,0)).getUTCDate(),weeks=Math.ceil((dow+dim)/7);
  var hasEnd=!pick.single&&pick.s!=null&&pick.e!=null&&pick.e>pick.s;
  var h='<div class="pick-p" role="dialog" aria-label="日付を選ぶ"><div class="pick-t">'+T+(pick.single?'の日付を選ぶ':'の期間を選ぶ')+'</div>';
  h+='<div class="pick-h"><b>'+pick.y+'年'+(pick.m+1)+'月</b><button type="button" class="link" data-pk-act="today">今日</button><button type="button" class="nav" data-pk-nav="-1" aria-label="前の月">‹</button><button type="button" class="nav" data-pk-nav="1" aria-label="次の月">›</button></div>';
  h+='<div class="wk">'+'日月火水木金土'.split('').map(function(c){return '<span>'+c+'</span>'}).join('')+'</div><div class="cg">';
  for(var i=0;i<weeks*7;i++){
    var n=start+i,d=fd(n),w=d.getUTCDay(),cls='pk'+(d.getUTCMonth()===pick.m?'':' out')+(w===6?' sat':w===0?' sun':'')+(n===today?' today':'');
    if(pick.s===n)cls+=' s'+(hasEnd?' hasend':'');
    if(!pick.single&&pick.e===n)cls+=' e'+(hasEnd?' hasend':'');
    if(hasEnd&&n>pick.s&&n<pick.e)cls+=' r';
    h+='<button type="button" class="'+cls+'" data-pk="'+n+'" aria-label="'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日"><span>'+d.getUTCDate()+'</span></button>';
  }
  h+='</div><div class="pick-sum">'+pickSummary()+'</div>';
  h+='<div class="pick-f"><button type="button" class="btn" data-pk-act="clear">クリア</button><button type="button" class="btn" data-pk-act="cancel">キャンセル</button><button type="button" class="btn primary" data-pk-act="ok">決定</button></div></div>';
  $('#pick').innerHTML=h;
}
function applyPick(clear){
  var it=draft[pick.key][pick.i];
  if(clear){if(pick.single)it.date='';else{it.start='';it.end=''}}
  else if(pick.s!=null){
    if(pick.single)it.date=dayIso(pick.s);
    else{it.start=dayIso(pick.s);it.end=pick.e!=null?dayIso(pick.e):''}
  }else{closePick();return}
  closePick();rerenderForm();toast(clear?'日付を消しました':'日付を入れました');
}
function onPick(e){
  if(!pick)return;
  if(e.target.id==='pick'){closePick();return}
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.pk){var n=Number(t.dataset.pk);
    if(pick.single)pick.s=n;

    renderPick();return}
  if(t.dataset.pkNav){pick.m+=Number(t.dataset.pkNav);if(pick.m<0){pick.m=11;pick.y--}if(pick.m>11){pick.m=0;pick.y++}renderPick();return}

function refreshQuick(path){
  var p=path.split('.');if(p.length!==3||!draft||!draft[p[0]])return;
  var el=document.querySelector('[data-quick="'+p[0]+'.'+p[1]+'"]');
  if(el&&document.activeElement!==el)el.value=quickText(p[0],draft[p[0]][Number(p[1])]);
}
function qnorm(s){return String(s||'').normalize('NFKC').replace(/[〜～–—]/g,'~').replace(/から/g,'~').replace(/\s+/g,' ').trim()}
function parseSide(t){
  var r={time:'',date:null};
  var m=t.match(/(\d{1,2})(?::(\d{2})|時(?:\s*(\d{1,2})\s*分?)?)/);
  if(m){var h=Number(m[1]),mi=Number(m[2]||m[3]||0);if(h<24&&mi<60)r.time=('0'+h).slice(-2)+':'+('0'+mi).slice(-2);t=t.replace(m[0],' ')}
  var d=t.match(/(\d{4})\s*[\/.\-年]\s*(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/);
  if(d)r.date={y:+d[1],m:+d[2],d:+d[3]};
  else{d=t.match(/(\d{1,2})\s*[\/.月]\s*(\d{1,2})/);if(d)r.date={y:0,m:+d[1],d:+d[2]}}
  return r;
}
function isoOf(y,m,d){var x=new Date(Date.UTC(y,m-1,d));if(x.getUTCMonth()!==m-1||x.getUTCDate()!==d)return null;
  return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)}
function resolveDate(p,afterDay){
  if(p.y)return isoOf(p.y,p.m,p.d);
  var base=afterDay!=null?afterDay:today-90;
  for(var y=now.getFullYear()-1;y<=now.getFullYear()+3;y++){
    var s=isoOf(y,p.m,p.d);if(s&&pd(s)>=base)return s}
  return null;
}
function applyQuick(key,i,text){
  var t=qnorm(text),parts=t.split('~'),a=parseSide(parts[0]),b=parts.length>1?parseSide(parts.slice(1).join('~')):null;
  if(!a.date)return false;
  var it=draft[key][i],d1=resolveDate(a);if(!d1)return false;
  if(key==='exams'){it.date=d1;it.start=a.time;it.end=b?b.time:'';return true}
  if(key==='results'){it.date=d1;it.time=a.time;return true}
  it.start=d1;it.startTime=a.time;
  if(b){var d2=b.date?resolveDate(b,pd(d1)):d1;if(!d2)return false;it.end=d2;it.endTime=b.time}
  else{it.end='';it.endTime=''}
  return true;
}

    h+='<div class="card">'+row('学部','entries.'+i+'.faculty','text','例: 工学部',en.faculty,false,'w-')+row('学科','entries.'+i+'.dept','text','例: 機械工学科',en.dept,false,'w-')+
      '<div class="wlab">受ける試験(複数選べます)</div><div class="pcs">'+presets.map(function(p){return '<button type="button" class="pc" data-exam="'+i+'" data-v="'+esc(p)+'" aria-pressed="'+(en.exams.indexOf(p)>=0)+'">'+esc(p)+'</button>'}).join('')+'</div>'+
      (wiz.entries.length>1?'<button type="button" class="rm" data-rm="'+i+'">この学部・学科を削除</button>':'')+'</div>';
  });
  h+='<button type="button" class="btn" id="w-addentry" style="justify-self:start">学部・学科を追加</button>';
  h+='<div class="card"><div class="inline"><input id="w-newexam" type="text" placeholder="試験の種類を追加(例: 英語外部試験利用)" autocomplete="off"><button type="button" class="btn" id="w-addpreset">追加</button></div></div>';
  if(sampleFn)h+='<div class="card">'+checks('日程の目安を自動入力',[['auto','入れる',wiz.auto]])+'</div><p class="hint warn">Claudeが知っている情報や前年度の傾向から日程の目安を入れます。ネット検索はしないため、最新の日程とは限りません。「目安」の付いた日程は、必ず募集要項で確認してください。</p>';
  h+='<p class="hint" id="w-count"></p><button type="button" class="link" id="w-manual" style="justify-self:start">1行ずつ詳しく入力する</button>';
  return h;
}
function wizCountText(){var c=$('#w-count');if(c)c.textContent='作成される行: '+wizCount()+'件(学部・学科 × 試験ごとに1行)'}
function openWiz(){wiz={univ:'',entries:[newEntry(null)],auto:true};presets=PRESETS.slice();$('#wiz-body').innerHTML=wizHtml();wizCountText();$('#wiz').hidden=false;var n=$('#w-univ');if(n)n.focus()}
function rerenderWiz(){var b=$('#wiz-body'),t=b.scrollTop;b.innerHTML=wizHtml();wizCountText();b.scrollTop=t}
var wb=$('#wiz-body');
wb.addEventListener('input',function(e){
  var p=e.target.dataset&&e.target.dataset.path;if(!p)return;
  setPath(wiz,p,e.target.type==='checkbox'?e.target.checked:e.target.value);
});
wb.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.exam!=null&&t.dataset.v!=null){var en=wiz.entries[Number(t.dataset.exam)],i=en.exams.indexOf(t.dataset.v);
    if(i>=0)en.exams.splice(i,1);else en.exams.push(t.dataset.v);
    t.setAttribute('aria-pressed',i<0);wizCountText();return}
  if(t.dataset.rm!=null){wiz.entries.splice(Number(t.dataset.rm),1);rerenderWiz();return}
  if(t.id==='w-addentry'){wiz.entries.push(newEntry(wiz.entries[wiz.entries.length-1]));rerenderWiz();return}
  if(t.id==='w-addpreset'){var v=$('#w-newexam').value.trim();if(v&&presets.indexOf(v)<0)presets.push(v);rerenderWiz();return}
  if(t.id==='w-manual'){$('#wiz').hidden=true;wiz=null;openSheet(null);return}
});
$('#w-cancel').onclick=function(){$('#wiz').hidden=true;wiz=null};
$('#w-make').onclick=function(){
  var univ=String(wiz.univ||'').trim();
  if(!univ){toast('学校名を入力してください');$('#w-univ').focus();return}
  var existing=schools.find(function(s){return s.univ===univ});
  var univs={};schools.forEach(function(s){univs[s.univ]=1});
  var color=existing?existing.color:COLORS[Object.keys(univs).length%COLORS.length];
  var rows=[];
  wiz.entries.forEach(function(en){
    (en.exams.length?en.exams:['']).forEach(function(ex){
      var r={id:uid(),univ:univ,faculty:en.faculty.trim(),dept:en.dept.trim(),exam:ex,examNo:'',color:color,order:'',apps:[],exams:[],results:[],enrolls:[]};
      r.name=label(r);rows.push(r)});
  });
  var auto=wiz.auto&&sampleFn;
  rows.forEach(function(r){schools.push(r)});
  save();$('#wiz').hidden=true;wiz=null;render();
  toast(rows.length+'件の行を作成しました');
  if(auto)autoFill(rows);
};

/* ---- 日程の目安を自動入力 ---- */
var ctl=null;
function banner(msg,btnText,fn){var b=$('#banner');$('#banner-text').textContent=msg;var bt=$('#banner-btn');bt.textContent=btnText||'';bt.hidden=!btnText;bt.onclick=fn||null;b.hidden=false}
function hideBanner(){$('#banner').hidden=true}
var okD=function(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(pd(s))};
var okT=function(s){return /^\d{2}:\d{2}$/.test(s||'')};
var D=function(s){return okD(s)?s:''}, T=function(s){return okT(s)?s:''};
var F=function(n){n=Number(n);return n>0?String(Math.round(n)):''};
function cleanAll(r){
  var a=(r.apps||[]).filter(function(x){return x&&(okD(x.start)||okD(x.end))}).map(function(x){return {start:D(x.start),end:D(x.end),startTime:T(x.startTime),endTime:T(x.endTime),web:!!x.web,mail:!!x.mail,fee:F(x.fee),est:true}});
  var e=(r.exams||[]).filter(function(x){return x&&okD(x.date)}).map(function(x){return {date:x.date,start:T(x.start),end:T(x.end),label:LABELS.indexOf(x.label)>=0?x.label:'試験',est:true}});
  var s=(r.results||[]).filter(function(x){return x&&okD(x.date)}).map(function(x){return {date:x.date,time:T(x.time),web:!!x.web,board:!!x.board,est:true}});
  var n=(r.enrolls||[]).filter(function(x){return x&&(okD(x.start)||okD(x.end))}).map(function(x){return {start:D(x.start),end:D(x.end),startTime:T(x.startTime),endTime:T(x.endTime),fee:F(x.fee),est:true}});
  return {apps:a,exams:e,results:s,enrolls:n,basis:String(r.basis||'').slice(0,200)};
}
async function autoFill(rows){
  if(!sampleFn){banner('この画面では自動入力を使えません。日程は手入力してください。','閉じる',hideBanner);return}
  var map={},keys=[];
  rows.forEach(function(r){var k=r.univ+'||'+r.exam;if(!map[k]){map[k]={univ:r.univ,exam:r.exam,units:[],ids:[]};keys.push(k)}
    var u=[r.faculty,r.dept].filter(Boolean).join(' ');if(u)map[k].units.push(u);map[k].ids.push(r.id)});
  var combos=keys.map(function(k){return map[k]});
  var y=now.getMonth()>=3?now.getFullYear()+1:now.getFullYear();
  var prompt='あなたは日本の大学入試の日程に詳しいアシスタントです。次の各項目について、'+y+'年度入試の日程を答えてください。\n'+
   '重要なルール:\n- あなたはインターネットを見られません。確実に知っている日付、または前年度までの実施パターンからの合理的な推定だけを答えます。\n- 分からない項目は空の配列にしてください。日付をでっち上げてはいけません。\n- 推定した場合は basis に根拠(例: 前年度の実績をもとにした推定)を1文で書きます。\n- 日付は YYYY-MM-DD、時刻は24時間の HH:MM、金額は円の整数。\n- exams の label は 試験/集合/面接/見学/その他 のいずれか。\n'+
   'JSON配列のみで返してください。形式:\n[{"i":0,"apps":[{"start":"","end":"","startTime":"","endTime":"","web":true,"mail":false,"fee":35000}],"exams":[{"date":"","start":"","end":"","label":"試験"}],"results":[{"date":"","time":"","web":true,"board":false}],"enrolls":[{"start":"","end":"","endTime":"","fee":0}],"basis":""}]\n\n対象:\n'+
   JSON.stringify(combos.map(function(c,i){return {i:i,大学:c.univ,試験:c.exam||'指定なし',学部学科:c.units}}));
  ctl=new AbortController();
  banner('日程の目安を調べています…','停止',function(){if(ctl)ctl.abort()});
  try{
    var res=await sampleFn.json(prompt,{signal:ctl.signal,modelTier:'default'});
    if(!Array.isArray(res))throw {code:'invalid_json'};
    var filled=0;
    res.forEach(function(r){var c=combos[Number(r&&r.i)];if(!c)return;var cl=cleanAll(r);
      if(!(cl.apps.length||cl.exams.length||cl.results.length||cl.enrolls.length))return;
      schools.forEach(function(s){if(c.ids.indexOf(s.id)<0)return;
        var any=false;
        ['apps','exams','results','enrolls'].forEach(function(k){if(!s[k].length&&cl[k].length){s[k]=JSON.parse(JSON.stringify(cl[k]));any=true}});
        if(any){s.basis=cl.basis;filled++}});
    });
    save();render();
    if(filled)banner(filled+'件の行に日程の目安を入れました。ネット検索はしていないため、必ず募集要項で確認してください。','閉じる',hideBanner);
    else banner('日程の情報を見つけられませんでした。募集要項を見て入力してください。','閉じる',hideBanner);
  }catch(e){
    var c=e&&e.code;
    if(c==='cancelled')hideBanner();
    else if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled')banner('Claudeの利用が許可されていないため、自動入力は使えません。日程は手入力してください。','閉じる',hideBanner);
    else if(c==='rate_limited')banner('利用回数の上限に達しました。時間をおいてから、各行を開いて入力してください。','閉じる',hideBanner);
    else banner('自動入力に失敗しました。日程は手入力してください。','閉じる',hideBanner);
  }finally{ctl=null}
}

/* ---- データの書き出し・読み込み ---- */
var replaceArmed=false;
function normSchool(o){
  if(!o||typeof o!=='object')return null;
  var str=function(v,n){return typeof v==='string'?v.slice(0,n||100):(typeof v==='number'?String(v):'')};
  var univ=str(o.univ||o.name,100).trim();if(!univ)return null;
  var s={id:/^[\w-]{1,40}$/.test(o.id||'')?o.id:uid(),univ:univ,faculty:str(o.faculty),dept:str(o.dept),exam:str(o.exam),examNo:str(o.examNo,30),memo:str(o.memo,300),basis:str(o.basis,200),
    color:/^#[0-9a-fA-F]{6}$/.test(o.color||'')?o.color:COLORS[0],
    order:(o.order===''||o.order==null||isNaN(Number(o.order)))?'':String(Number(o.order))};
  s.name=label(s);
  var A=function(k,fn){return (Array.isArray(o[k])?o[k]:[]).slice(0,50).map(fn).filter(Boolean)};
  s.apps=A('apps',function(x){if(!x||!(okD(x.start)||okD(x.end)))return null;return {start:D(x.start),end:D(x.end),startTime:T(x.startTime),endTime:T(x.endTime),web:!!x.web,mail:!!x.mail,fee:F(x.fee),est:!!x.est}});
  s.exams=A('exams',function(x){if(!x||!okD(x.date))return null;return {date:x.date,start:T(x.start),end:T(x.end),label:LABELS.indexOf(x.label)>=0?x.label:'試験',est:!!x.est}});
  s.results=A('results',function(x){if(!x||!okD(x.date))return null;return {date:x.date,time:T(x.time),web:!!x.web,board:!!x.board,est:!!x.est}});
  s.enrolls=A('enrolls',function(x){if(!x||!(okD(x.start)||okD(x.end)))return null;return {start:D(x.start),end:D(x.end),startTime:T(x.startTime),endTime:T(x.endTime),fee:F(x.fee),est:!!x.est}});
  return s;
}
function dmsg(m){var el=$('#d-msg');if(el)el.textContent=m}
function openData(){
  replaceArmed=false;
  var json=JSON.stringify({app:'juken-nittei',version:1,exportedAt:new Date().toISOString(),schools:schools},null,1);
  var inApp=!!window.claude;
  $('#data-body').innerHTML=
   '<div class="card"><div class="wlab">書き出し</div><p class="hint" style="padding:0">いまの全データです。コピーしてメモなどに保存してください。別の端末や別のURLで「読み込み」に貼り付けると、そのまま移せます。</p>'+
   '<textarea class="ta" id="d-out" readonly aria-label="書き出したデータ">'+esc(json)+'</textarea>'+
   '<div class="inline"><button type="button" class="btn" data-d="copy">コピー</button>'+(inApp?'':'<button type="button" class="btn" data-d="save">ファイルに保存</button>')+'</div></div>'+
   '<div class="card"><div class="wlab">読み込み</div><p class="hint" style="padding:0">書き出したデータを貼り付けるか、ファイルを選んでください。</p>'+
   '<textarea class="ta" id="d-in" placeholder="ここに貼り付け" aria-label="読み込むデータ"></textarea>'+
   '<div class="inline"><label class="btn filebtn">ファイルを選ぶ<input type="file" accept=".json,application/json,text/plain" data-dfile="1"></label></div>'+
   '<div class="inline"><button type="button" class="btn" data-d="add">追加して読み込む</button><button type="button" class="btn danger" data-d="replace" id="d-replace">置き換えて読み込む</button></div>'+
   '<p class="hint" style="padding:0">「追加」は、いまのデータに足します(同じ行は飛ばします)。「置き換え」は、いまのデータをすべて入れ替えます。</p></div>'+
   '<p class="hint" id="d-msg" role="status"></p>';
  $('#data').hidden=false;
}
function doImport(mode){
  var txt=($('#d-in').value||'').trim();
  if(!txt){dmsg('読み込むデータを貼り付けるか、ファイルを選んでください。');return}
  var data;try{data=JSON.parse(txt)}catch(e){dmsg('データの形式が正しくありません。書き出したデータをそのまま貼り付けてください。');return}
  var arr=Array.isArray(data)?data:(data&&Array.isArray(data.schools)?data.schools:null);
  if(!arr){dmsg('このデータは、この画面のものではないようです。');return}
  var rows=arr.map(normSchool).filter(Boolean);
  if(!rows.length){dmsg('読み込める行がありません。');return}
  if(mode==='replace'){
    if(!replaceArmed){replaceArmed=true;$('#d-replace').textContent='もう一度押すと置き換えます';return}
    schools=rows;save();render();replaceArmed=false;$('#d-replace').textContent='置き換えて読み込む';
    dmsg(rows.length+'件で置き換えました。');
  }else{
    var have={};schools.forEach(function(s){have[s.id]=1});
    var add=rows.filter(function(r){return !have[r.id]});
    schools=schools.concat(add);save();render();
    dmsg(add.length+'件を追加しました'+(rows.length-add.length?'(既にある'+(rows.length-add.length)+'件は飛ばしました)':'')+'。');
  }
}
$('#d-close').onclick=function(){$('#data').hidden=true};
$('#data-body').addEventListener('input',function(e){
  if(e.target.id==='d-in'&&replaceArmed){replaceArmed=false;var b=$('#d-replace');if(b)b.textContent='置き換えて読み込む'}
});
$('#data-body').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||!t.dataset.d)return;
  var a=t.dataset.d;
  if(a==='copy'){
    var ta=$('#d-out');ta.focus();ta.select();
    try{navigator.clipboard.writeText(ta.value).then(function(){dmsg('コピーしました。')},function(){dmsg('自動でコピーできませんでした。選択された文字をコピーしてください。')})}
    catch(err){dmsg('自動でコピーできませんでした。選択された文字をコピーしてください。')}
  }else if(a==='save'){
    var blob=new Blob([$('#d-out').value],{type:'application/json'}),u=URL.createObjectURL(blob),an=document.createElement('a');
    an.href=u;an.download='juken-nittei-'+now.toISOString().slice(0,10)+'.json';document.body.appendChild(an);an.click();an.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);dmsg('ファイルを保存しました。');
  }else if(a==='add')doImport('add');
  else if(a==='replace')doImport('replace');
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t||!t.dataset||!t.dataset.dfile)return;
  var f=t.files&&t.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){$('#d-in').value=String(r.result||'');dmsg('ファイルを読み込みました。下のボタンで反映してください。')};
  r.onerror=function(){dmsg('ファイルを読めませんでした。')};
  r.readAsText(f);t.value='';
});

/* ---- wiring ---- */
$('#new').onclick=openWiz;
$('#datab').onclick=openData;
$('#pick').addEventListener('click',onPick);
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){setView(b.dataset.view)}});
$('#jump').onclick=jump;
$('#main').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.cal){
    if(t.dataset.cal==='today'){var td=fd(today);calY=td.getUTCFullYear();calM=td.getUTCMonth();selDay=today}
    else{calM+=Number(t.dataset.cal);if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}selDay=null}
    render();return}
  if(t.dataset.day){selDay=Number(t.dataset.day);var cl=$('.cal'),st=cl?cl.scrollTop:0;render();var c2=$('.cal');if(c2)c2.scrollTop=st;return}
  if(t.dataset.edit)openSheet(t.dataset.edit);
  if(t.dataset.new)openWiz();
});
render();
setTimeout(jump,50);
})();
</script>
